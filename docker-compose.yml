
services:
  postgres:
    image: postgres:16
    container_name: recovr_postgres
    environment:
      POSTGRES_USER: recovr
      POSTGRES_PASSWORD: recovr_dev
      POSTGRES_DB: recovr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovr -d recovr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
